name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual re-run (e.g. a staging retry) without re-tagging

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) — no token, no 2FA

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: install wasm-opt
        run: |
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_119/binaryen-version_119-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_119/bin" >> "$GITHUB_PATH"
      # NOTE: no registry-url here — setup-node would write an .npmrc with a
      # placeholder NODE_AUTH_TOKEN, and a configured token (even a bogus one)
      # preempts npm's OIDC trusted-publishing exchange (E401).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npm >= 11.5.1 (required for trusted publishing)
        run: npm install -g npm@latest && npm --version
      - name: OIDC availability check
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC available: id-token request URL is set"
          else
            echo "OIDC NOT available: id-token permission missing from job"
          fi
      - name: tag must match package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./js/facetful/package.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package v$v"; exit 1; }
      - name: hyparquet (parquet differential dependency)
        run: npm install --prefix web/spike-bench
      - name: release gate (budget + smokes + differential + pack)
        run: ./scripts/build-package.sh
      - name: stage (OIDC; a maintainer approves with 2FA to go live)
        run: npm stage publish
        working-directory: js/facetful
