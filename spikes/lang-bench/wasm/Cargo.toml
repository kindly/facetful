[package]
name = "lang-bench"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# size-oriented profile, to report what a -Oz build would weigh
[profile.minsize]
inherits = "release"
opt-level = "z"
