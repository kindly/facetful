[workspace]
resolver = "2"
members = [
    "crates/facetful-format",
    "crates/facetful-engine",
    "crates/facetful-wasm",
    "crates/facetful-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Shipping profile (wasm + CLI). opt-level=3, not "z": measured 2-3x faster
# (auto-vectorization/unrolling suppressed at "z") for +15KB gz — interaction
# speed is priority #1. The size budget is enforced by scripts/size-check.sh.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Native tooling (CLI, tests, benches) wants speed, not size.
[profile.native]
inherits = "release"
opt-level = 3
panic = "unwind"
